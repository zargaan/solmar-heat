<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Heat — open-world crime game</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; font-family: system-ui, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .hud { position: fixed; color: #fff; text-shadow: 0 1px 3px #000; z-index: 5; pointer-events: none; }
  #topleft { top: 12px; left: 14px; font-size: 20px; font-weight: 700; }
  #healthbar { width: 180px; height: 12px; background: rgba(0,0,0,0.6); border: 1px solid #fff; margin-top: 6px; }
  #health { height: 100%; width: 100%; background: #2fae5f; }
  #wanted { top: 12px; right: 16px; font-size: 26px; color: #ffd700; letter-spacing: 2px; }
  #objective { top: 12px; left: 50%; transform: translateX(-50%); max-width: 560px; text-align: center; font-size: 15px; background: rgba(0,0,0,0.55); padding: 6px 12px; border-radius: 6px; }
  #message { bottom: 64px; left: 50%; transform: translateX(-50%); font-size: 16px; background: rgba(0,0,0,0.55); padding: 6px 12px; border-radius: 6px; white-space: nowrap; }
  #speed { bottom: 14px; left: 14px; font-size: 15px; background: rgba(0,0,0,0.55); padding: 5px 10px; border-radius: 6px; }
  #ammo { bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 15px; }
  #minimap { position: fixed; right: 14px; bottom: 14px; width: 200px; height: 150px; border: 2px solid #fff; z-index: 5; background: #111; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Solmar Heat: an open-world crime game in Solmar Bay"></canvas>
<div class="hud" id="topleft"><span id="money">$250</span><div id="healthbar"><div id="health"></div></div></div>
<div class="hud" id="wanted">☆☆☆☆☆</div>
<div class="hud" id="objective">Press ENTER to start</div>
<div class="hud" id="message"></div>
<div class="hud" id="speed"></div>
<div class="hud" id="ammo"></div>
<canvas id="minimap" width="200" height="150"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
